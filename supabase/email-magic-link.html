<!-- Supabase Dashboard > Authentication > Emails > Templates > "Magic link"
     Subject: Link masuk AURA
     Tempel isi di bawah ini. Link memakai token_hash (bisa dibuka di perangkat mana pun) + kode angka cadangan. -->
<h2>Masuk ke AURA</h2>
<p>Klik tombol di bawah untuk masuk. Link hanya berlaku sekali dan sebentar.</p>
<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email"
      style="display:inline-block;padding:12px 20px;border-radius:10px;background:#5cb8f4;color:#0f1b2b;font-weight:700;text-decoration:none">Masuk ke AURA</a></p>
<p>Link tidak terbuka? Masukkan kode ini di halaman login AURA:</p>
<p style="font-size:28px;font-weight:800;letter-spacing:6px">{{ .Token }}</p>
<p style="color:#666">Bila kamu tidak meminta ini, abaikan saja email ini.</p>
